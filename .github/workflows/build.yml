name: Build VANY KitKat ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clear Space & Clean Runner
        run: |
          echo "ডিস্ক স্পেস খালি করা হচ্ছে..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Install KitKat Dependencies & Legacy Fixes
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential ccache curl flex bison gperf libxml2-utils \
            unzip zlib1g-dev lib32z1-dev lib32ncurses-dev repo git \
            libgl1-mesa-dev xsltproc openjdk-8-jdk python2 python2-minimal \
            libncurses5 libtinfo5 lib32ncurses5 lib32tinfo6 || true

          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          echo "ডিপেনডেন্সি এবং লিগেসি লাইব্রেরি প্রস্তুত।"

      - name: Set Up Python 2 Symlink
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "পাইথন ২ সেট করা হয়েছে।"

      - name: Sync and Build VANY KitKat ROM (Combined Step)
        run: |
          mkdir -p /home/runner/kitkat_rom
          cd /home/runner/kitkat_rom
          git config --global user.name "VANY KitKat Builder"
          git config --global user.email "kitkat@vany.os"
          
          echo "সোর্স কোড ইনিশিয়ালাইজ ও সিঙ্ক শুরু হচ্ছে (এটি কিছুটা সময় নিতে পারে)..."
          repo init -u https://github.com/CyanogenMod/android.git -b cm-11.0 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          
          echo "সোর্স কোড সিঙ্ক সফল! এখন কম্পাইলেশন শুরু হচ্ছে..."
          source build/envsetup.sh
          lunch cm_arm-eng
          make -j$(nproc)
          

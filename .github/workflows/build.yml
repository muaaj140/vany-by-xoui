name: Build VANY Custom ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          echo "Clearing non-essential build environments..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/rubies
          sudo apt-get clean
          docker image prune --all --force || true
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential ccache flex bison gperf libxml2-utils \
            curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip python2

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync LineageOS Source
        run: |
          mkdir -p ~/rom
          cd ~/rom
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --git-lfs --depth=1
          
          # Setup local manifest with safe error handling
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/roomservice.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/vany/vany" name="muaaj140/android_device_vany" remote="github" revision="cm-14.1" />
          </manifest>
          EOF
          
          # Attempt sync with manifest, fallback to standard sync if custom repo missing
          echo "Starting repo sync..."
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags || \
          (rm -rf .repo/local_manifests/roomservice.xml && repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags)

      - name: Setup Environment and Lunch Target
        run: |
          cd ~/rom
          source build/envsetup.sh
          
          # Check and auto-select available target
          echo "Configuring target architecture..."
          lunch lineage_vany-userdebug || \
          lunch aosp_arm64-userdebug || \
          lunch cm_arm64-userdebug

      - name: Compile System Image
        run: |
          cd ~/rom
          make systemimage -j$(nproc --all)

      - name: Compress Output Artifact
        run: |
          cd ~/rom/out/target/product/*
          if [ -f system.img ]; then
            zip -9 ~/vany-system.zip system.img
          else
            echo "Error: system.img was not compiled successfully" && exit 1
          fi

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vany-system-image
          path: ~/vany-system.zip
          retention-days: 7

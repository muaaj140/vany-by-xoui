name: Build VANY ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clear Space & Clean Runner
        run: |
          echo "Clearing non-essential build packages to save space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Install Dependencies & Universal Ncurses Fix
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential ccache curl flex bison gperf libxml2-utils \
            unzip zlib1g-dev lib32z1-dev lib32ncurses-dev \
            libgl1-mesa-dev xsltproc openjdk-8-jdk python2 python2-minimal \
            libncurses6 libtinfo6 lib32ncurses6 lib32tinfo6 || true

          # Direct Global Symlink for Clang Toolchain (Fixes Error 127 permanently)
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/libncurses.so.5
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/libtinfo.so.5
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          
          # For multiarch support
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

          echo "Ncurses v5 legacy bridges successfully linked."

      - name: Set Up Python 2 Symlink
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "Python 2 set as default."

      - name: Run VANY ROM Build
        run: |
          echo "Starting VANY ROM Compilation..."
          source build/envsetup.sh
          lunch aosp_arm-eng
          make -j$(nproc)

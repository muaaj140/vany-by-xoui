name: VANY Custom KitKat ROM Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install exact build dependencies for Ubuntu 22.04
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openjdk-8-jdk \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses-dev \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python2 \
            git \
            schedtool \
            pngcrush \
            imagemagick \
            liblz4-tool \
            make \
            bc

      - name: Setup Python2 symlink
        shell: bash
        run: |
          set -euxo pipefail
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version
          which python

      - name: Install repo tool into ~/bin
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          repo --version

      - name: Create dedicated build directory
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /home/runner/cyanogenmod

      - name: Configure git for repo
        shell: bash
        run: |
          set -euxo pipefail
          git config --global user.email "ci-builder@example.com"
          git config --global user.name "CI Builder"
          git config --global color.ui false

      - name: Initialize repo with shallow clone
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/bin:$PATH"
          cd /home/runner/cyanogenmod
          repo init -u https://github.com/CyanogenMod/android.git -b cm-11.0 --depth=1

      - name: Sync repo sources (force-sync, no-clone-bundle)
        shell: bash
        timeout-minutes: 360
        run: |
          set -euxo pipefail
          export PATH="$HOME/bin:$PATH"
          cd /home/runner/cyanogenmod
          repo sync --force-sync --no-clone-bundle --jobs=4 2>&1 | tee sync.log

      - name: Verify synced source directory
        shell: bash
        run: |
          set -euxo pipefail
          cd /home/runner/cyanogenmod
          if [ -d "build" ]; then
            echo "✓ build directory exists"
          else
            echo "✗ build directory missing"
            exit 1
          fi

      - name: Start CyanogenMod compilation (Envsetup, Lunch & Make)
        shell: bash
        timeout-minutes: 480
        run: |
          set -euxo pipefail
          cd /home/runner/cyanogenmod
          source build/envsetup.sh
          lunch full_arm-eng
          echo "Starting build at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Collect and Upload build artifacts & logs
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/build-artifacts
          cd /home/runner/cyanogenmod

          [ -f "build.log" ] && cp build.log /tmp/build-artifacts/build.log || true
          [ -f "sync.log" ] && cp sync.log /tmp/build-artifacts/sync.log || true

          if [ -d "out/target/product/generic_arm" ]; then
            find out/target/product/generic_arm -maxdepth 1 \( -name "*.zip" -o -name "*.img" \) -type f -exec cp {} /tmp/build-artifacts/ \;
          elif [ -d "out/target/product/full_arm" ]; then
            find out/target/product/full_arm -maxdepth 1 \( -name "*.zip" -o -name "*.img" \) -type f -exec cp {} /tmp/build-artifacts/ \;
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build-artifacts/*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload ROM images and zip files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyanogenmod-artifacts
          path: |
            /tmp/build-artifacts/*.zip
            /tmp/build-artifacts/*.img
          retention-days: 30
          if-no-files-found: ignore

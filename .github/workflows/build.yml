name: Build Vany Emulator APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # gradlew ফাইলটিকে রান করার পারমিশন দেওয়া
      - name: Make gradlew executable
        run: chmod +x gradlew

      # APK তৈরি করার জন্য Gradle কমান্ড
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # তৈরি হওয়া APK ফাইলটি Artifact হিসেবে আপলোড করা
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vany-Emulator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          

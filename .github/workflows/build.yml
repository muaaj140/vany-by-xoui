- name: Sync and Build VANY KitKat ROM
        run: |
          mkdir -p /home/runner/kitkat_rom
          cd /home/runner/kitkat_rom
          git config --global user.name "VANY KitKat Builder"
          git config --global user.email "kitkat@vany.os"
          
          echo "সোর্স কোড ইনিশিয়ালাইজ ও সিঙ্ক সফল!"
          
          echo "এখন কম্পাইলেশন শুরু হচ্ছে..."
          source build/envsetup.sh
          lunch cm_emulator-eng
          make -j$(nproc)

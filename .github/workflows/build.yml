name: Build VANY OS (Android 8.0 Oreo)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Repo Manifest URL (e.g. LineageOS or AOSP)'
        required: true
        default: 'https://github.com/LineageOS/android'
      MANIFEST_BRANCH:
        description: 'Branch Name (e.g. lineage-15.1 for Android 8.1)'
        required: true
        default: 'lineage-15.1'
      DEVICE_NAME:
        description: 'Device Codename (e.g. dumpling)'
        required: true
        default: 'dumpling'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev libgl1-mesa-dev libx11-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3 openjdk-8-jdk wget repo

      - name: Configure Git
        run: |
          git config --global user.name "Muaj"
          git config --global user.email "muaj@vanyos.com"

      - name: Initialize Repo and Sync
        run: |
          mkdir -p ~/android/vany
          cd ~/android/vany
          repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

      - name: Setup Device Tree and VANY Customizations
        run: |
          cd ~/android/vany
          echo "Placing custom VANY bootanimation, settings, and device tree..."

      - name: Start Building VANY OS
        run: |
          cd ~/android/vany
          source build/envsetup.sh
          breakfast ${{ github.event.inputs.DEVICE_NAME }} userdebug
          mka bacon -j$(nproc)

      - name: Upload Built VANY OS ROM
        uses: actions/upload-artifact@v4
        with:
          name: VANY-OS-${{ github.event.inputs.DEVICE_NAME }}-Android8
          path: ~/android/vany/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

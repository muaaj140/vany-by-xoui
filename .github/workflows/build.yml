name: CyanogenMod 11.0 Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-8-jdk \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses6-dev \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python2
          
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Set JAVA_HOME for OpenJDK 8
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize, Sync and Build ROM
        run: |
          # ফোল্ডার তৈরি এবং সেটআপ এক ব্লকে করা হলো যাতে পাথ মিসিং না হয়
          mkdir -p /home/runner/cyanogenmod
          cd /home/runner/cyanogenmod
          
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"
          
          echo "=== Repo Init ==="
          repo init -u https://github.com/CyanogenMod/android.git -b cm-11.0 --depth=1
          
          echo "=== Repo Sync ==="
          repo sync --force-sync --no-clone-bundle --jobs=4 --depth=1 2>&1 | tee sync.log
          
          echo "=== Build Environment Setup & Compilation ==="
          source build/envsetup.sh
          lunch cm_emulator-eng
          make -j$(nproc) 2>&1 | tee build.log

      - name: Check build output
        if: always()
        run: |
          cd /home/runner/cyanogenmod
          if [ -d "out/target/product" ]; then
            echo "Build artifacts generated:"
            find out/target/product -type f -name "*.img" -o -name "*.zip" | head -20
          else
            echo "No build artifacts found"
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyanogenmod-build
          path: /home/runner/cyanogenmod/out/target/product/
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /home/runner/cyanogenmod/build.log
            /home/runner/cyanogenmod/sync.log
          retention-days: 7
          
